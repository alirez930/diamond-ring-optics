 pixels.fill(0);for(let i=0;i<CELL_COUNT;i++){const gi=charGrid[i];if(!gi)continue;const tag=tagGrid[i],rgb=COLORS[tag]||COLORS[0],alpha=clamp(lumGrid[i],0,1),gx=(i%COLS)*CW,gy=((i/COLS)|0)*CH,off=(gi-1)*CW*CH;for(let py=0;py<CH;py++){let dst=((gy+py)*W+gx)*4,src=off+py*CW;for(let px=0;px<CW;px++){const m=glyphAtlas[src+px];if(!m)continue;const v=alpha*m/255;pixels[dst+px*4]=rgb[0]*v;pixels[dst+px*4+1]=rgb[1]*v;pixels[dst+px*4+2]=rgb[2]*v;pixels[dst+px*4+3]=255}}}for(let i=3;i<pixels.length;i+=4)if(pixels[i]===0)pixels[i]=255;frameCtx.putImageData(imageData,0,0);
 return{yaw,glintCount,visible};
}
function drawHud(t,info){const deg=((info.yaw/TAU*360)%360+360)%360;out.save();out.setTransform(view.width/W,0,0,view.height/H,0,0);out.font='17px Consolas, Menlo, "DejaVu Sans Mono", monospace';out.textBaseline='alphabetic';out.fillStyle='rgba(120,112,128,.76)';out.fillText('@jin_22ee · 2026',64,H-70);out.fillStyle='rgba(110,104,120,.9)';out.fillText(`rotation ${deg.toFixed(2).padStart(6,'0')}°   glints ${String(info.glintCount).padStart(4,' ')}`,64,H-44);out.fillText(`letters ${info.visible.toLocaleString('en-US').padStart(5,' ')}`,64,H-18);out.fillStyle='#ff7ab6';out.beginPath();out.arc(W-135,30,3,0,TAU);out.fill();out.fillStyle='#ff7ab6';out.fillText(`t ${t.toFixed(2).padStart(5,'0')}s`,W-120,36);out.restore()}
function compose(t,info){
 // Half-life persistence, then maximum blend, matching Pygame's trail surface.
 trailCtx.save();trailCtx.globalCompositeOperation='source-over';trailCtx.fillStyle='rgba(0,0,0,.5)';trailCtx.fillRect(0,0,W,H);trailCtx.globalCompositeOperation='lighten';trailCtx.drawImage(frameCanvas,0,0);trailCtx.restore();
 // Two independently downsampled blur/glow passes, close to the original glow stack.
 glowACtx.clearRect(0,0,glowA.width,glowA.height);glowACtx.imageSmoothingEnabled=true;glowACtx.drawImage(trailCanvas,0,0,glowA.width,glowA.height);glowFullCtx.clearRect(0,0,W,H);glowFullCtx.save();glowFullCtx.filter='blur(1.25px)';glowFullCtx.drawImage(glowA,0,0,W,H);glowFullCtx.restore();
 glowBCtx.clearRect(0,0,glowB.width,glowB.height);glowBCtx.imageSmoothingEnabled=true;glowBCtx.drawImage(trailCanvas,0,0,glowB.width,glowB.height);glowFullCtx.save();glowFullCtx.globalCompositeOperation='lighter';glowFullCtx.globalAlpha=.6;glowFullCtx.filter='blur(2.75px)';glowFullCtx.drawImage(glowB,0,0,W,H);glowFullCtx.restore();
 const scaleX=view.width/W,scaleY=view.height/H;out.setTransform(scaleX,0,0,scaleY,0,0);out.globalCompositeOperation='source-over';out.globalAlpha=1;out.fillStyle='#000';out.fillRect(0,0,W,H);out.globalCompositeOperation='lighter';out.globalAlpha=.75;out.drawImage(glowFull,0,0);out.globalAlpha=1;out.drawImage(trailCanvas,0,0);out.globalCompositeOperation='source-over';drawHud(t,info);
}
function render(t){const info=drawFrame(t);compose(t,info)}
function resize(){dpr=Math.min(window.devicePixelRatio||1,2);const rect=stage.getBoundingClientRect();view.width=Math.round(rect.width*dpr);view.height=Math.round(rect.height*dpr);render(time)}
function toast(s){toastEl.textContent=s;toastEl.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toastEl.classList.remove('show'),1200)}
function restart(){time=0;dragYaw=0;trailCtx.clearRect(0,0,W,H);render(0);last=0;toast('Animation restarted')}
function setPause(v){paused=v;pauseBtn.textContent=paused?'▶':'Ⅱ';pauseBtn.setAttribute('aria-label',paused?'Resume':'Pause');last=0;toast(paused?'Paused':'Resumed')}
function save(){const a=document.createElement('a');a.download='diamond-ring-ascii.png';a.href=view.toDataURL('image/png');a.click();toast('PNG saved')}
function toggleFull(){if(!document.fullscreenElement)stage.requestFullscreen?.().then(()=>resize()).catch(()=>toast('Fullscreen unavailable'));else document.exitFullscreen?.()}
function tick(stamp){requestAnimationFrame(tick);if(!last)last=stamp;if(stamp-lastRender<33)return;const dt=Math.min((stamp-last)/1000,1/15);last=stamp;lastRender=stamp;if(!paused){time+=dt;if(time>=LOOP){time=0;trailCtx.clearRect(0,0,W,H)}render(time)}}
pauseBtn.addEventListener('click',()=>setPause(!paused));document.getElementById('restart').addEventListener('click',restart);document.getElementById('save').addEventListener('click',save);document.getElementById('full').addEventListener('click',toggleFull);
view.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY};view.setPointerCapture?.(e.pointerId)});view.addEventListener('pointermove',e=>{if(!drag)return;dragYaw+=(e.clientX-drag.x)*.006;drag.x=e.clientX;drag.y=e.clientY;render(time)});view.addEventListener('pointerup',()=>drag=null);view.addEventListener('pointercancel',()=>drag=null);
window.addEventListener('resize',resize);window.addEventListener('keydown',e=>{if(e.target&&['INPUT','TEXTAREA'].includes(e.target.tagName))return;if(e.code==='Space'){e.preventDefault();setPause(!paused)}else if(e.key.toLowerCase()==='r')restart();else if(e.key.toLowerCase()==='s')save();else if(e.key.toLowerCase()==='f')toggleFull()});
resize();requestAnimationFrame(tick);
})();
